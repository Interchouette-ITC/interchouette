[package]
name = "interchouette-chat"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
description = "Interchouette website chat (WebSocket + Slack)"
authors = ["Interchouette <contact@interchouette.net>"]

[[bin]]
name = "interchouette-chat"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
] }
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "tokio",
    "json",
    "ws",
    "query",
] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
futures-util = "0.3"
llm-guard = "0.2"
regex = "1"
html-escape = "0.2.13"
reqwest = { version = "0.13", default-features = false, features = [
    "form",
    "json",
    "rustls",
] }
scraper = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "fs",
    "io-util",
    "sync",
] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = "s"
