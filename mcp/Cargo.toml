[package]
name = "interchouette-mcp"
version = "0.2.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
description = "Interchouette MCP"
authors = ["Interchouette <contact@interchouette.net>"]

[[bin]]
name = "interchouette-mcp"
path = "src/main.rs"

[[bin]]
name = "interchouette-mcp-db"
path = "src/bin/interchouette-mcp-db.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "tokio",
    "json",
] }
clap = { version = "4", features = ["derive", "env"] }
rmcp = { version = "3.1", default-features = false, features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
rusqlite = { version = "0.40", default-features = false, features = [
    "bundled",
] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "fs",
    "io-util",
    "sync",
] }
toml = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = "s"
