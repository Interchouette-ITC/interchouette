[[doc]]
slug = "itcy"
lang = "en"
title = "ITCy"
body = """
ITCy is the Interchouette ITC mascot: a little Linux owl who likes IT, humour, and wordplay.

ITCy is a disclosed AI experience:
- Operates the company LinkedIn page: https://linkedin.com/company/interchouette-itc
- Operates the company X account: https://x.com/interchouette
- Runs away-mode visitor chat on https://interchouette.net/ (when Greg is offline)

Disclosure on public posts:
Written by AI - ITCy - model <provider/id> - tokens in:<n> out:<n>

Public principles:
- BAT (publications PR approval) before any public LinkedIn or X publish
- Posts in English; comment replies match the comment language
- ITCy is AI, not Gregory Roussac and not a human employee

Code repository (implementation): https://github.com/Interchouette-ITC/itcy
Status UI: https://github.com/Interchouette-ITC/itcy-tui
Publications pipeline (live content on GitHub, not in this database): https://github.com/Interchouette-ITC/itcy-publications
Branch = kind: drafts and posts (LinkedIn), drafts_tweet and tweets (X). Each artefact is body.md plus meta.toml under a date shard. BAT (gRoussac Approve) before merge to posts/tweets.

AI worker GitHub profile: https://github.com/Interchouette
"""

