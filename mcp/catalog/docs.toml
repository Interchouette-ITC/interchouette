[[doc]]
slug = "cv-summary"
lang = "en"
title = "Gregory Roussac - CV summary"
body = """
Title: Senior Software Engineer | Rust Backend, Angular Frontend and Distributed Systems. Location: Hilversum, NL.

Senior software engineer with 20+ years building full stack applications, distributed systems, APIs, and developer tooling. Recent focus: Rust services, APIs, SDKs, Wasm, Docker on VPS and AWS. Earlier: Angular frontends and PHP e-commerce.

Roles:
- Nov 2022 - Present: Senior Rust/Wasm Software Engineer, Interchouette (ITC), Hilversum, NL (freelance ZZP). Engagements include Casper Labs, Casper Association, and confidential enterprise platforms.
- Nov 2022 - Dec 2024: Software Engineer, Rust smart contracts, Casper Labs (remote via Interchouette).
- Apr 2017 - Apr 2022: Front End Developer, Independer, Hilversum, NL.
- Jul 2016 - Feb 2017: Python / JavaScript Developer, Byte B.V. (Hypernode), Amsterdam, NL.
- Dec 2012 - Feb 2016: Lead Core PHP / MySQL Developer, PrestaShop, Paris, FR.
- Nov 2009 - Oct 2012: Owner / Managing Director, Interchouette (ITC), Paris, FR.
- Jun 2008 - Nov 2009: Project Manager, PHP / MySQL, PrestaShop, Paris, FR.
- Feb 2007 - May 2008: Web Project Manager, Come&Stay, Paris, FR.
- Jan 2005 - Jan 2007: Owner, So Many Wines Ltd, Guildford, GB.
- Sep 2003 - Aug 2004: PHP / MySQL Developer, Cedelia, Tremblay, FR.

Education: Master's (DESS) IT Applications for Economic and Social Management, Universite Paris VII (2003-2004); BA International Business, ESCE (1999-2003); Erasmus, HTW Berlin (2001).

HTML CV: https://interchouette.net/CV
"""

