# Static MCP documents (en/nl/fr). Compiled via make mcp-db.

[[doc]]
slug = "overview"
lang = "en"
title = "Interchouette ITC"
body = """
Interchouette ITC is a Dutch sole proprietorship (eenmanszaak / ZZP) in Hilversum, the Netherlands. Gregory Roussac founded it in 2022.

The name Interchouette is a French pun: "Internet, c'est chouette" ("the Internet is cool"). ITC stands for Information Technology Company. Work sits around Hilversum, Amsterdam, and Paris.

Focus areas:
- Rust / Wasm: systems, SDKs, performance-minded services
- AI operators: disclosed agents, RAG, model routing for visitor chat
- Markets and tooling: trading infrastructure and related products
- MCP: Streamable HTTP model-context servers for LLM agents

Technical focus: APIs (Axum, Tokio), SDKs, Docker delivery, and cryptographic or blockchain infrastructure when that is the job.

Public sites: https://interchouette.net/, https://interchouette.nl, https://interchouette.fr. Official MCP: https://mcp.interchouette.net/

ITCy is the company mascot (a Linux owl) and the disclosed AI that answers visitor chat when Greg is away.

News: https://interchouette.net/news. Feeds: https://api.interchouette.net/v1/news/rss.xml. MCP tool: get_news.
"""

