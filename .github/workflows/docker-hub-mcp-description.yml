name: Hub MCP Overview

# Sync Hub Overview without rebuilding the image (description-only changes).
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "docker/DOCKERHUB.md"
      - "docker/sync-hub-description.py"
      - ".github/workflows/docker-hub-mcp-description.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-hub-description:
    name: Sync interchouette-mcp Hub Overview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Make
        run: sudo apt-get install -y make

      - name: Sync Docker Hub Overview from docker/DOCKERHUB.md
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: make mcp-docker-hub-desc
