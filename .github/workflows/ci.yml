name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Action runtimes: Node 24+ (checkout / setup-node v7).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  NPM_CONFIG_FUND: "false"

jobs:
  ci:
    name: format · audit · build · test · publish · console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: www/.nvmrc
          cache: npm
          cache-dependency-path: www/package-lock.json

      - name: Assert Node major matches pin
        run: |
          expected="$(tr -d '[:space:]' < .nvmrc)"
          actual="$(node -v | sed 's/^v//')"
          echo "expected=${expected} actual=${actual}"
          test "${actual}" = "${expected}"

      - name: Install
        run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: npm audit (high+)
        run: npm audit --audit-level=high

      - name: Production build (static + prerender)
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Verify static publish layout
        run: node scripts/verify-static-dist.mjs

      - name: Install Chromium for static console gate
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
        run: npx playwright install --with-deps chromium

      - name: Console errors on packed dist
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
          CI: "true"
        run: node scripts/check-static-console.mjs

      - name: Deploy to Render
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        working-directory: .
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          hook="$(printf '%s' "$RENDER_DEPLOY_HOOK_URL" | tr -d '\r\n')"
          # GET, no body. Do not print the URL (it is the secret).
          http_code="$(curl -sS -o /tmp/render-hook.json -w '%{http_code}' --get "$hook")"
          echo "render_hook_http=${http_code}"
          cat /tmp/render-hook.json
          echo
          case "$http_code" in
            200|202) ;;
            *) exit 1 ;;
          esac

      - name: Upload browser publish dir
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-dist-on-failure
          path: www/dist/interchouette/browser
          if-no-files-found: ignore
          retention-days: 7
