name: CI/CD MCP Image

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "mcp/**"
      - "db/**"
      - "docker/Dockerfile"
      - "Makefile"
      - ".github/workflows/docker-build-push-mcp.yml"

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-push-mcp:
    name: Build and Push interchouette-mcp :dev + :latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Set up Make
        run: sudo apt-get install -y make

      - name: Build MCP image :dev + :latest
        run: make mcp-docker-build

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push :dev and :latest to Docker Hub
        run: make mcp-docker-push-hub

      - name: Sync Docker Hub Overview from docker/DOCKERHUB.md
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: make mcp-docker-hub-desc

      - name: Log in to GHCR (personal)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Push to personal GHCR
        run: make mcp-docker-push-ghcr-personal

      - name: Log in to GHCR (Interchouette / ITC)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME_ITC }}
          password: ${{ secrets.GHCR_PAT_ITC }}

      - name: Push to ghcr.io/interchouette and interchouette-itc
        run: make mcp-docker-push-ghcr-itc

      - name: Deploy MCP on Render
        env:
          RENDER_DEPLOY_HOOK_URL_MCP: ${{ secrets.RENDER_DEPLOY_HOOK_URL_MCP }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL_MCP"
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL_MCP"
