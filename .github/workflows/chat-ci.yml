name: Chat Rust CI

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - "backend/**"
      - "Makefile"
      - ".github/workflows/chat-ci.yml"
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - "Makefile"
      - ".github/workflows/chat-ci.yml"

concurrency:
  group: chat-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

jobs:
  chat:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Lint + test
        run: make chat-lint chat-test

  image:
    name: Publish API image to GHCR
    needs: chat
    if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/interchouette-itc/interchouette-api:dev
            ghcr.io/interchouette-itc/interchouette-api:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Interchouette-ITC/interchouette
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=interchouette-api
          cache-to: type=gha,mode=max,scope=interchouette-api
