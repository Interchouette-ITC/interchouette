# Refresh static news prerender + apex RSS/Atom on the same cadence as NEWS_CACHE_TTL (4h).
# Render rebuild runs generate-news-static.mjs during npm run build.
name: News static refresh

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-render:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render static deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          hook="$(printf '%s' "$RENDER_DEPLOY_HOOK_URL" | tr -d '\r\n')"
          # GET, no body. Do not print the URL (it is the secret).
          http_code="$(curl -sS -o /tmp/render-hook.json -w '%{http_code}' --get "$hook")"
          echo "render_hook_http=${http_code}"
          cat /tmp/render-hook.json
          echo
          case "$http_code" in
            200|202) ;;
            *) exit 1 ;;
          esac
