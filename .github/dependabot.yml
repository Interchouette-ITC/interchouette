# Group Angular packages; ignore dtolnay/rust-toolchain (action tags are not
# always publishable rustc versions, e.g. 1.120.0 → 404).
version: 2
updates:
  - package-ecosystem: npm
    directory: /www
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-eslint/*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: dtolnay/rust-toolchain
