    <script>
      (() => {
        const params = new URLSearchParams(location.search);
        const q = params.get('lang');
        let locale = 'en';
        if (q === 'nl' || q === 'fr' || q === 'en') {
          locale = q;
        } else if (/\.nl$/i.test(location.hostname)) {
          locale = 'nl';
        } else if (/\.fr$/i.test(location.hostname)) {
          locale = 'fr';
        }
        const html = document.documentElement;
        html.lang = locale;
        html.setAttribute('data-locale', locale);
        if (locale !== 'en') {
          window.setTimeout(() => html.classList.add('app-ready'), 4000);
        }
      })();
    </script>
