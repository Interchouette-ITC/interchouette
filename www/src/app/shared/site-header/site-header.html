<header class="site-header">
  <a
    class="site-header__brand"
    routerLink="/"
    routerLinkActive="is-current"
    [routerLinkActiveOptions]="{ exact: true }"
    aria-label="interchouette.net"
    [attr.title]="copy.headerHomeTitle"
  >
    <span class="site-header__inter">inter</span>chouette<span
      class="site-header__dot"
      aria-hidden="true"
    ></span
    ><span class="site-header__tld">net</span>
  </a>
  <div class="site-header__marquee-slot" aria-hidden="true">
    @if (marqueeLive()) {
      <marquee class="site-header__marquee" scrollamount="3" scrolldelay="35">
        {{ copy.headerMarquee }}
      </marquee>
    }
  </div>
  <nav class="site-header__nav" [attr.aria-label]="copy.headerBrand">
    <a routerLink="/news" routerLinkActive="is-current" [attr.title]="copy.titleNews">{{
      copy.headerNews
    }}</a>
    <a
      [href]="slackJoinUrl"
      target="_blank"
      rel="noopener noreferrer"
      [attr.title]="copy.titleSlack"
      [attr.aria-label]="copy.titleSlack"
      >{{ copy.headerSlack }}</a
    >
    @if (session.profile(); as profile) {
      <a
        class="site-header__account"
        routerLink="/account"
        routerLinkActive="is-current"
        [attr.title]="copy.titleAccount"
      >
        <img
          class="site-header__avatar"
          [src]="profile.picture"
          width="28"
          height="28"
          alt=""
          decoding="async"
        />
        <span>{{ session.firstName() }}</span>
      </a>
    } @else {
      <button
        type="button"
        class="site-header__login"
        (click)="onClientLogin()"
        [attr.title]="copy.titleLogin"
      >
        {{ copy.headerLogin }}
      </button>
    }
  </nav>
</header>
