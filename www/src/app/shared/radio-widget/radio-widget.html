@if (mounted()) {
  <div
    class="radio"
    [class.radio--playing]="playing()"
    [class.radio--muted]="muted()"
    [class.radio--frame]="frameOpen()"
    [class.radio--busy]="loading()"
  >
    <div class="radio__row">
      <button
        type="button"
        class="radio__sound"
        (click)="onSoundToggle()"
        [attr.aria-label]="soundLabel()"
        [attr.title]="soundLabel()"
        [attr.aria-pressed]="!muted()"
      >
        <span aria-hidden="true">♪</span>
      </button>

      <button
        type="button"
        class="radio__toggle"
        [disabled]="loading()"
        (click)="onPlayToggle()"
        [attr.aria-label]="playLabel()"
        [attr.title]="playLabel()"
        [attr.aria-pressed]="playing()"
      >
        <span class="radio__note" aria-hidden="true">♪</span>
        <span class="radio__tri" aria-hidden="true"></span>
        <span class="radio__bar" aria-hidden="true">
          <span class="radio__knob"></span>
        </span>
      </button>

      <button
        type="button"
        class="radio__frame-btn"
        (click)="onFrameToggle()"
        [attr.aria-label]="frameLabel()"
        [attr.title]="frameLabel()"
        [attr.aria-pressed]="frameOpen()"
      >
        <span class="radio__panel" aria-hidden="true"></span>
      </button>
    </div>

    <iframe
      [id]="frameId"
      class="radio__frame"
      title="Interchouette SoundCloud radio"
      width="300"
      height="90"
      allow="autoplay; encrypted-media"
      [attr.tabindex]="frameOpen() ? 0 : -1"
    ></iframe>
  </div>
}
