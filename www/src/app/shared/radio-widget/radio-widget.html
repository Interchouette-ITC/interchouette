@if (mounted()) {
  <div class="radio" [class.radio--on]="playing()" [class.radio--busy]="loading()">
    <button
      type="button"
      class="radio__toggle"
      [disabled]="loading()"
      (click)="onToggle()"
      [attr.aria-label]="buttonLabel()"
      [attr.title]="buttonLabel()"
      [attr.aria-pressed]="playing()"
    >
      <span class="radio__note" aria-hidden="true">♪</span>
      <span class="radio__tri" aria-hidden="true"></span>
      <span class="radio__bar" aria-hidden="true">
        <span class="radio__knob"></span>
      </span>
    </button>
  </div>
}

<iframe
  [id]="frameId"
  class="radio-frame"
  title="Interchouette SoundCloud radio"
  width="166"
  height="166"
  allow="autoplay; encrypted-media"
  tabindex="-1"
></iframe>
