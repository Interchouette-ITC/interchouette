@if (mounted()) {
  <div
    class="radio"
    [class.radio--on]="showFrame()"
    [class.radio--busy]="loading()"
    [class.radio--playing]="playing()"
  >
    <button
      type="button"
      class="radio__toggle"
      [disabled]="loading()"
      (click)="onToggle()"
      [attr.aria-label]="buttonLabel()"
      [attr.title]="buttonLabel()"
      [attr.aria-pressed]="showFrame()"
    >
      <span class="radio__note" aria-hidden="true">♪</span>
      <span class="radio__tri" aria-hidden="true"></span>
      <span class="radio__bar" aria-hidden="true">
        <span class="radio__knob"></span>
      </span>
    </button>

    <iframe
      [id]="frameId"
      class="radio__frame"
      title="Interchouette SoundCloud radio"
      width="320"
      height="100"
      allow="autoplay; encrypted-media"
      [attr.tabindex]="showFrame() ? 0 : -1"
    ></iframe>
  </div>
}
