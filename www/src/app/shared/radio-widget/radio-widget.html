@if (mounted()) {
  <div
    class="radio"
    [class.radio--playing]="playing()"
    [class.radio--muted]="muted()"
    [class.radio--frame]="frameOpen()"
    [class.radio--busy]="loading()"
  >
    <div class="radio__controls" role="group" [attr.aria-label]="copy.radio.play">
      <button
        type="button"
        class="radio__btn radio__btn--play"
        [disabled]="loading()"
        (click)="onPlayToggle(); $event.stopPropagation()"
        [attr.aria-label]="playLabel()"
        [attr.title]="playLabel()"
        [attr.aria-pressed]="playing()"
      >
        <span class="radio__tri" aria-hidden="true"></span>
      </button>

      <button
        type="button"
        class="radio__btn radio__btn--next"
        [disabled]="loading()"
        (click)="onNext(); $event.stopPropagation()"
        [attr.aria-label]="copy.radio.next"
        [attr.title]="copy.radio.next"
      >
        <span class="radio__skip" aria-hidden="true"></span>
      </button>

      <button
        type="button"
        class="radio__btn radio__btn--sound"
        (click)="onMuteToggle(); $event.stopPropagation()"
        [attr.aria-label]="soundLabel()"
        [attr.title]="soundLabel()"
        [attr.aria-pressed]="!muted()"
      >
        <span class="radio__note" aria-hidden="true">♪</span>
      </button>

      <button
        type="button"
        class="radio__btn radio__btn--frame"
        (click)="onFrameToggle(); $event.stopPropagation()"
        [attr.aria-label]="frameLabel()"
        [attr.title]="frameLabel()"
        [attr.aria-pressed]="frameOpen()"
      >
        <span class="radio__bar" aria-hidden="true">
          <span class="radio__knob"></span>
        </span>
      </button>
    </div>

    @if (frameSrc(); as src) {
      <iframe
        [id]="frameId"
        class="radio__frame"
        title="Interchouette SoundCloud radio"
        width="300"
        height="166"
        allow="autoplay; encrypted-media"
        [src]="src"
        (load)="onFrameLoad()"
        [attr.tabindex]="frameOpen() ? 0 : -1"
      ></iframe>
    }
  </div>
}
