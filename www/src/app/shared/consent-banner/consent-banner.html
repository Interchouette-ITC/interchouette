@if (visible()) {
  <aside class="consent" role="dialog" [attr.aria-label]="copy.consent.dialog">
    <p class="consent__joke">{{ joke() }}</p>
    <p class="consent__body">
      {{ copy.consent.bodyBefore }}
      <strong>{{ copy.consent.bodyStrong }}</strong>
      {{ copy.consent.bodyAfter }}
      <a routerLink="/privacy">{{ copy.consent.privacy }}</a>
      .
    </p>
    <div class="consent__actions">
      <button
        type="button"
        class="consent__btn consent__btn--ghost"
        [attr.title]="copy.consent.declineTitle"
        (click)="reject()"
      >
        {{ copy.consent.decline }}
      </button>
      <button
        type="button"
        class="consent__btn consent__btn--primary"
        [attr.title]="copy.consent.acceptTitle"
        (click)="accept()"
      >
        {{ copy.consent.accept }}
        <img
          class="consent__cookie"
          src="/img/cookie.png"
          width="28"
          height="28"
          alt=""
          decoding="async"
          aria-hidden="true"
        />
      </button>
    </div>
  </aside>
}
